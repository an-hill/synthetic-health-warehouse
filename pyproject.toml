[project]
name = "dbt-airflow"
version = "0.1.0"
description = "A synthetic health warehouse: windowed loader, dbt star schema, Airflow orchestration"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = ["duckdb>=1.5"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    # Pinned exactly, deliberately. `ty` is beta on 0.0.x and diagnostics can
    # break between any two versions, so upgrades should be a deliberate act.
    "ty==0.0.66",
    # Here rather than in the dbt group, which the Astro image installs and has
    # no use for a linter. Its templater needs dbt, so `make lint-sql` asks for
    # both groups.
    "sqlfluff",
    "sqlfluff-templater-dbt",
]
# Separate from the loader's own dependencies: the loader must stay runnable and
# testable without dbt installed, because in Airflow it runs as its own step.
# Pinned exactly because the Astro image installs this same group, and a range
# would let the image and the Makefile resolve different dbt versions.
dbt = ["dbt-duckdb==1.10.1"]
# Never apache-airflow itself: the runtime image owns that, and pip installing
# over the top gives a container that boots and then misbehaves.
airflow = ["astronomer-cosmos==1.15.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loader"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "F",    # Pyflakes: undefined names, unused imports and variables
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort: import ordering
    "N",    # pep8-naming
    "UP",   # pyupgrade: modern syntax for the target version
    "B",    # bugbear: likely bugs, notably mutable default arguments
    "A",    # builtins: shadowing `id`, `type`, `list`
    "C4",   # comprehensions
    "DTZ",  # datetimez: bans naive datetimes
    "ISC",  # implicit string concatenation
    "PIE",  # misc unnecessary code
    "PT",   # pytest style
    "PTH",  # use pathlib rather than os.path
    "RET",  # return statement simplification
    "SIM",  # simplify
    "TID",  # tidy imports: bans `..` relative imports
    "ARG",  # unused function arguments
    "S",    # bandit: security checks
    "D2",   # docstring whitespace and layout
    "D4",   # docstring content and section structure
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",    # line length is the formatter's job, and it will not split
               # long URLs or string literals that Ruff would flag here
    "ISC001",  # conflicts with the formatter, which owns string concatenation
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# S608: a table name cannot be bound as a SQL parameter, so it is interpolated.
# Everything interpolated here is a module constant; paths and window bounds are
# bound.
"src/loader/*.py" = ["S608"]
# Tests assert, pytest fixtures are frequently declared but not referenced in the
# body, and they interpolate table names for the same reason as the loader.
"tests/**" = ["S101", "ARG", "S608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
