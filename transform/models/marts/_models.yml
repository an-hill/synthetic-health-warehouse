version: 2

models:
  - name: dim_provider
    description: >
      One row per clinician. Holds every provider the source carries rather than
      only those with an encounter in the landed window, so the dimension does
      not change shape under the fact it is conformed against. Synthea's
      speciality is left behind: all 650 providers are GENERAL PRACTICE.
    columns:
      - name: provider_id
        data_tests: [unique, not_null]
      - name: zip
        description: Text, not a number. Every one here is a Massachusetts code beginning with a zero.

  - name: dim_payer
    description: One row per payer, including NO_INSURANCE, which is how the source records an uncovered patient rather than by a null.
    columns:
      - name: payer_id
        data_tests: [unique, not_null]
      - name: payer_name
        data_tests: [not_null]

  - name: dim_patient
    description: >
      A type-2 slowly changing dimension, one row per patient per version of
      their attributes, every one of which is versioned. The payer and death
      are what move in this export, but the source stands in for a live patient
      system, where a corrected birthdate or a re-collected ethnicity is
      ordinary. Built from snap_patient alone, since patients.parquet is not
      landed and patients_current is the only patient source there is. Age is
      left out and derived at query time instead, because versioning it would
      add a row per patient per year and bury the changes that matter. Read as
      of a date with valid_from <= d and (valid_to is null or valid_to > d),
      where the open version carries a null rather than a far-future sentinel,
      so nothing has to agree on which date means forever. The contract is
      enforced for those two columns because a reader comparing a timestamp
      against a date is relying on a cast, and this is what makes the build
      fail rather than the cast change under them.
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [patient_id, valid_from]
    columns:
      - name: patient_id
        description: Repeated across a patient's versions, so unique only over the open ones.
        data_type: varchar
        data_tests:
          - not_null
          - unique:
              config:
                where: is_current
      - name: payer_id
        description: >
          Null for a patient with no coverage on the date. Synthea stops
          renewing coverage after 2025-12-01, so a version dated past that
          records a lapse that is an artefact of the export ending rather than
          of anyone losing insurance.
        data_type: varchar
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_payer')
                field: payer_id
      - name: birthdate
        data_type: date
        data_tests: [not_null]
      - name: gender
        data_type: varchar
      - name: race
        data_type: varchar
      - name: ethnicity
        data_type: varchar
      - name: birthplace
        data_type: varchar
      - name: is_deceased
        data_type: boolean
      - name: deceased_date
        description: Null for a living patient, and the only attribute here that can move from a value back to null under a correction.
        data_type: date
      - name: valid_from
        description: The window end at which this version was first observed, not the time dbt ran.
        data_type: timestamp
        data_tests: [not_null]
      - name: valid_to
        description: The window end at which the next version replaced it, and null for the current one.
        data_type: timestamp
      - name: is_current
        description: Whether valid_to is null, carried as a column so a consumer filtering to the open version does not have to know that.
        data_type: boolean

  - name: fct_encounter
    description: >
      One row per encounter, materialised as a table because it is joined and
      aggregated far more often than it is built. Carries the encounter's own
      costs and a count of the conditions and medications recorded at it. No
      claim amounts: raw claims are an append log, so summing them here would
      count a restatement twice, and they are windowed on their billing date so
      any total stored here would go stale as later claims arrive.
    columns:
      - name: encounter_id
        data_tests: [unique, not_null]
      - name: patient_id
        description: >
          Deliberately carries no relationships test. patients_current is
          replaced per window, so a backfill running windows out of order
          strands encounters against patients the table no longer holds.
        data_tests: [not_null]
      - name: provider_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_provider')
                field: provider_id
      - name: payer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_payer')
                field: payer_id
      - name: total_cost
        description: What the encounter cost in total, which its claims apportion between them.
        data_tests: [not_null]
      - name: patient_responsibility
        description: What the payer did not cover. Never negative in this export, where coverage never exceeds the total.
        data_tests: [not_null]
      - name: condition_count
        description: Zero rather than null for the 18,991 encounters of 31,611 that record none.
        data_tests: [not_null]
      - name: medication_count
        data_tests: [not_null]
      - name: _service_date
        description: The date that decided which window this encounter was landed in.
        data_tests: [not_null]

  - name: fct_claim
    description: >
      One row per claim, holding its latest submission. Incremental with a merge
      on claim_id, which is what collapses the append log in raw.claims: a
      restated claim arrives a second time under the same id and replaces the
      row rather than adding one. An arrival is read only if it is billed later
      than the one already held for that same claim, which is what makes the
      order windows land in irrelevant. Re-landing a window it has already built
      over needs --full-refresh, because a merge cannot delete.
    columns:
      - name: claim_id
        description: Shared by a claim's original submission and any restatement, and the key the merge collapses them on.
        data_tests: [unique, not_null]
      - name: encounter_id
        description: >
          Carries no relationships test. A claim is windowed on its billing
          date, so it can bill for an encounter that predates the range and was
          never landed. stg_claims counts those at warn severity.
        data_tests: [not_null]
      - name: patient_id
        data_tests: [not_null]
      - name: received_date
        description: When the latest submission was billed.
        data_tests: [not_null]
      - name: billed_amount
        description: The current amount, after any restatement.
        data_tests: [not_null]
      - name: billing_lag_days
        description: Days from service to the latest billing, 0 to 100 in this export and heavily skewed to 0.
        data_tests: [not_null]

  - name: fct_readmission
    description: >
      One row per index admission, which is the denominator: the rate is
      sum(is_readmitted) over count(*), computed by whoever asks rather than
      stored, so a cut by payer or by year needs no new model. An index
      admission is an inpatient encounter discharged at least 30 days before
      the latest admission the warehouse holds. A readmission is the earliest
      later inpatient admission for the same patient, 1 to 30 days after that
      discharge. Day 30 counts because Synthea generates recurring admissions
      on near-monthly cycles, so 32 of the 125 readmissions sit exactly on day
      30 and reading the bound as 29 would drop a quarter of them. The number
      is not clinically meaningful. Synthea does not model readmission
      behaviour, seven patients hold 20 or more stays each and account for 110
      of the 125, and 79 of the inpatient encounters are a recurring
      detoxification regimen that a real measure would exclude as planned. The
      query is the deliverable. The rate is an artefact of the generator.
      The contract is here for the column set: this is the one mart a consumer
      would compute a rate from, and a column quietly added or dropped changes
      what that rate is over.
    config:
      contract:
        enforced: true
    columns:
      - name: index_encounter_id
        description: The admission being measured, and the only encounter here that had to have 30 days of observation after it.
        data_type: varchar
        data_tests: [unique, not_null]
      - name: patient_id
        data_type: varchar
        data_tests: [not_null]
      - name: admit_date
        description: Carried so the denominator can be cut by period without joining back to the encounter it came from.
        data_type: date
      - name: discharge_date
        description: >
          Read in UTC, which profiles.yml pins. The export's timestamps carry a
          zone, so the same discharge falls on different dates in different
          ones, and every gap here is counted in whole days from this one.
        data_type: date
        data_tests: [not_null]
      - name: readmission_encounter_id
        description: >
          Null where the admission was not followed by one, which is most of
          them. Carries no relationships test to fct_encounter: both encounter
          ids are selected from it, so the test could not fail.
        data_type: varchar
      - name: days_to_readmission
        description: >
          Whole days from discharge to the next admission, 1 to 30, and null
          where there was none. A gap of 0 or less is a transfer rather than a
          readmission: one rule covers both the 22 stays beginning on the day of
          discharge and the 2 beginning before it, and admitting them would take
          125 readmissions to 142. The excluded stay then stands as its own index
          admission rather than merging into the first, so a transfer chain is
          counted as two admissions where a real measure would treat it as one
          episode.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 30
                inclusive: true
        data_type: bigint
      - name: is_readmitted
        description: The numerator.
        data_type: boolean
        data_tests: [not_null]
