version: 2

models:
  - name: dim_provider
    description: >
      One row per clinician. Holds every provider the source carries rather than
      only those with an encounter in the landed window, so the dimension does
      not change shape under the fact it is conformed against. Synthea's
      speciality is left behind: all 650 providers are GENERAL PRACTICE.
    data_tests:
      - assert_grain_is_unique:
          arguments:
            columns: [provider_id]
    columns:
      - name: provider_id
        data_tests: [unique, not_null]
      - name: zip
        description: Text, not a number. Every one here is a Massachusetts code beginning with a zero.

  - name: dim_payer
    description: One row per payer, including NO_INSURANCE, which is how the source records an uncovered patient rather than by a null.
    data_tests:
      - assert_grain_is_unique:
          arguments:
            columns: [payer_id]
    columns:
      - name: payer_id
        data_tests: [unique, not_null]
      - name: payer_name
        data_tests: [not_null]

  - name: dim_patient
    description: >
      One row per patient per version of their attributes, every one of which
      is versioned: the payer and death are what move in this export, but the
      source stands in for a live patient system, where a corrected birthdate
      or a re-collected ethnicity is ordinary. Built from
      snap_patient alone: patients.csv
      is not landed, so patients_current is the only patient source there is.
      Age is left out and derived at query time instead, since versioning it
      would add a row per patient per year and bury the changes that matter.
      Read as of a date with valid_from <= d and (valid_to is null or valid_to
      > d): the open version carries a null rather than a far-future sentinel,
      so nothing has to agree on which date means forever.
    data_tests:
      - assert_grain_is_unique:
          arguments:
            columns: [patient_id, valid_from]
    columns:
      - name: patient_id
        description: Repeated across a patient's versions, so unique only over the open ones.
        data_tests:
          - not_null
          - unique:
              config:
                where: is_current
      - name: payer_id
        description: >
          Null for a patient with no coverage on the date. Synthea stops
          renewing coverage after 2025-12-01, so a version dated past that
          records a lapse that is an artefact of the export ending rather than
          of anyone losing insurance.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_payer')
                field: payer_id
      - name: birthdate
        data_tests: [not_null]
      - name: valid_from
        description: The window end at which this version was first observed, not the time dbt ran.
        data_tests: [not_null]
      - name: valid_to
        description: The window end at which the next version replaced it, and null for the current one.

  - name: fct_encounter
    description: >
      One row per encounter, materialised as a table because it is joined and
      aggregated far more often than it is built. Carries the encounter's own
      costs and a count of the conditions and medications recorded at it. No
      claim amounts: raw claims are an append log, so summing them here would
      count a restatement twice, and they are windowed on their billing date so
      any total stored here would go stale as later claims arrive.
    data_tests:
      - assert_grain_is_unique:
          arguments:
            columns: [encounter_id]
    columns:
      - name: encounter_id
        data_tests: [unique, not_null]
      - name: patient_id
        description: >
          Deliberately carries no relationships test. patients_current is
          replaced per window, so a backfill running windows out of order
          strands encounters against patients the table no longer holds.
        data_tests: [not_null]
      - name: provider_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_provider')
                field: provider_id
      - name: payer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_payer')
                field: payer_id
      - name: total_cost
        description: What the encounter cost in total, which its claims apportion between them.
        data_tests: [not_null]
      - name: patient_responsibility
        description: What the payer did not cover. Never negative in this export, where coverage never exceeds the total.
        data_tests: [not_null]
      - name: condition_count
        description: Zero rather than null for the 581 encounters in a four-month window that record none.
        data_tests: [not_null]
      - name: medication_count
        data_tests: [not_null]
      - name: _service_date
        description: The date that decided which window this encounter was landed in.
        data_tests: [not_null]

  - name: fct_claim
    description: >
      One row per claim, holding its latest submission. Incremental with a merge
      on claim_id, which is what collapses the append log in raw.claims: a
      restated claim arrives a second time under the same id and replaces the
      row rather than adding one. An arrival is read only if it is billed later
      than the one already held for that same claim, which is what makes the
      order windows land in irrelevant. Re-landing a window it has already built
      over needs --full-refresh, because a merge cannot delete.
    data_tests:
      - assert_grain_is_unique:
          arguments:
            columns: [claim_id]
    columns:
      - name: claim_id
        description: Shared by a claim's original submission and any restatement, and the key the merge collapses them on.
        data_tests: [unique, not_null]
      - name: encounter_id
        description: >
          Carries no relationships test. A claim is windowed on its billing
          date, so it can bill for an encounter that predates the range and was
          never landed. stg_claims counts those at warn severity.
        data_tests: [not_null]
      - name: patient_id
        data_tests: [not_null]
      - name: received_date
        description: When the latest submission was billed.
        data_tests: [not_null]
      - name: billed_amount
        description: The current amount, after any restatement.
        data_tests: [not_null]
      - name: billing_lag_days
        description: Days from service to the latest billing, 0 to 100 in this export and heavily skewed to 0.
        data_tests: [not_null]
