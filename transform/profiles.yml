health_warehouse:
  target: dev
  outputs:
    dev:
      type: duckdb
      # dbt resolves a relative path against the directory dbt was invoked from,
      # not against --project-dir, and DuckDB creates whatever it is handed, so
      # a wrong one produces an empty database rather than an error. The default
      # matches the loader's, meaning the repository root; the Makefile and
      # Airflow both set the variable absolutely so it never depends on cwd.
      path: "{{ env_var('DBT_WAREHOUSE_PATH', 'warehouse.duckdb') }}"
      # DuckDB's single-writer constraint is between processes, not within one,
      # so dbt's own threads are safe. It is separate dbt processes under Airflow
      # that need the pool of 1.
      threads: 4
      settings:
        # The same pin loader.connect makes, for the same reason: the export's
        # timestamps carry a zone, so casting one to a date resolves it in the
        # session's, and a discharge date read in Sydney is a day later than the
        # same row read in UTC.
        TimeZone: "UTC"
