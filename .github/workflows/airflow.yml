name: Airflow

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  dags:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs for the reason given in python-checks.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      # Its own workflow rather than a step in python-checks.yml, which would
      # pull the airflow and dbt groups into a job that needs neither.
      - name: The DAGs parse and the split still covers the project
        run: make test-dags
