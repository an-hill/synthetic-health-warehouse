name: dbt

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs for the reason given in python-checks.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      # Land a three month window in stages to simulate a data feed
      - name: Land the first two months
        run: uv run python -m loader.land --window-start 2025-09-01 --window-end 2025-11-01

      # Green here says the sources resolve and name what the loader really
      # wrote. It says nothing about the thresholds: the window landed seconds
      # ago, so 24 hours cannot be approached, let alone crossed.
      - name: Sources resolve against a landed window
        run: make freshness

      # Which is why the threshold is watched failing, against a copy aged past
      # it. A freshness block deleted, or an error_after mistyped in days, would
      # otherwise leave this workflow green.
      - name: A stale source fails the build
        run: |
          cp warehouse.duckdb aged.duckdb
          uv run python -c "import duckdb; con = duckdb.connect('$PWD/aged.duckdb'); con.execute('update raw.encounters set _loaded_at = _loaded_at - interval 3 days'); con.close()"
          if DBT_WAREHOUSE_PATH="$PWD/aged.duckdb" make freshness; then
            echo "::error::a three-day-old source passed freshness"
            exit 1
          fi

      - name: Build and test the models
        run: make build

      # fct_claim's incremental branch is unreachable on a fresh warehouse, and
      # snap_patient needs a second as-of date before it can record a change, so
      # one landing leaves both untested. 2025-12-01 is the last boundary inside
      # the payer history, after which Synthea stops renewing coverage.
      - name: A second window exercises the incremental merge and the snapshot
        run: |
          uv run python -m loader.land --window-start 2025-11-01 --window-end 2025-12-01
          make build

      # Nothing in the models guarantees the second window restates anything the
      # first landed, so a boundary elsewhere could take it to zero and leave the
      # merge unexercised with every test still green. Counted off _loaded_at so
      # the check survives the windows changing; their amounts are reconciled by
      # assert_restatements_are_absorbed.
      - name: The merge updated claims the first build inserted
        run: |
          uv run python -c "
          import duckdb, sys
          con = duckdb.connect('$PWD/warehouse.duckdb', read_only=True)
          crossed = con.execute('select count(*) from (select claim_id from raw.claims group by 1 having count(distinct _loaded_at) > 1)').fetchone()[0]
          print(f'{crossed} claims arrived in more than one landing')
          sys.exit(None if crossed else '::error::the second window restated nothing the first build had inserted')
          "

      # The snapshot's own tests hold after a single window, so a build that
      # captured no change at all would still be green. Four patients switch
      # payer between these two window ends.
      - name: The snapshot captured the payer changes
        run: |
          uv run python -c "
          import duckdb, sys
          con = duckdb.connect('$PWD/warehouse.duckdb', read_only=True)
          versioned = con.execute('select count(*) from (select patient_id from dim_patient group by 1 having count(*) > 1)').fetchone()[0]
          sys.exit(None if versioned == 4 else f'::error::{versioned} patients hold more than one version, expected 4')
          "

      # The pre-hook is what keeps an out-of-order landing recoverable, so it is
      # watched refusing rather than assumed to. On a copy, because the landing
      # it takes is the one that would write unrepairable history if the hook
      # were ever removed. A red build is not the assertion: without the hook
      # the build goes red too, at assert_patient_versions_tile, having already
      # written the history the hook exists to prevent. What is asserted is that
      # nothing carries the earlier date.
      - name: An earlier as-of date is refused
        run: |
          cp warehouse.duckdb backwards.duckdb
          uv run python -c "
          from datetime import date
          from pathlib import Path
          from loader.land import land_window
          land_window(date(2025, 9, 1), date(2025, 10, 1), database=Path('backwards.duckdb'))
          "
          DBT_WAREHOUSE_PATH="$PWD/backwards.duckdb" make build || true
          uv run python -c "
          import duckdb, sys
          from datetime import date
          con = duckdb.connect('$PWD/backwards.duckdb', read_only=True)
          written = con.execute('select count(*) from snap_patient where dbt_valid_from = ?', [date(2025, 10, 1)]).fetchone()[0]
          sys.exit(None if written == 0 else f'::error::{written} versions were written dated from the earlier window')
          "
